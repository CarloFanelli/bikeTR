name: biketr

services:
  web:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${WEB_PORT:-5050}:80"
    volumes:
      # Solo per l'indice dei paper, che il Coach service scarica a ogni richiesta.
      - ./:/usr/share/nginx/html:ro
      - ./docker/nginx:/etc/nginx/templates:ro
    depends_on:
      app:
        condition: service_started
      auth:
        condition: service_started
      coach:
        condition: service_started

  # L'app del browser: server di sviluppo Vite con live reload, raggiungibile solo da nginx.
  app:
    image: node:22-alpine
    init: true
    working_dir: /workspace/web
    # Installa i pacchetti npm che mancano, poi esegue il comando.
    entrypoint: ["sh", "scripts/start.sh"]
    command: ["npx", "vite"]
    volumes:
      - ./web:/workspace/web
      # Pacchetti npm installati nel container: quelli del computer non entrano mai.
      - web-modules:/workspace/web/node_modules
      # Codice del server di autenticazione, per il controllo dei tipi e i test.
      - ./docker/auth:/workspace/docker/auth:ro

  # Login Strava: l'unico servizio che vede il client secret e il refresh token.
  auth:
    image: node:22-alpine
    # Inoltra a Node il segnale di stop: senza, `docker compose down` attende 10 s.
    init: true
    command: ["node", "/app/server.ts"]
    volumes:
      - ./docker/auth:/app:ro
      # Token Strava: restano dopo `docker compose down`, spariscono con `down -v`.
      - auth-data:/data
    environment:
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:-}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:-}
      WEB_PORT: ${WEB_PORT:-5050}

  # Servizio Coach: parla con Ollama, all'indirizzo scritto in .env.
  coach:
    # Python, i pacchetti di docker/coach/requirements.txt e il modello di ricerca dei paper;
    # il codice è montato qui sotto.
    build: ./docker/coach
    image: biketr-coach
    init: true
    volumes:
      - ./docker/coach:/app:ro
      # Corse e dettagli corsa scaricati da Strava: restano dopo `docker compose down`,
      # spariscono con `down -v` o con "Disconnetti da Strava".
      - coach-data:/data
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
    depends_on:
      # Non aspetta i modelli: il Coach parte anche durante il primo download,
      # e anche quando Ollama è spento (OLLAMA_CONTAINERS=0).
      ollama:
        condition: service_started
        required: false

  # Comandi che scrivono nella cartella del progetto, come la ricostruzione dell'indice dei
  # paper. Parte solo quando lo si nomina: docker compose run --rm coach-tools <comando>.
  coach-tools:
    build: ./docker/coach
    # La stessa immagine del Coach: dopo `docker compose up -d --build` anche questa è nuova.
    image: biketr-coach
    profiles: [tools]
    init: true
    volumes:
      - ./docker/coach:/app:ro
      - ./:/project

  ollama:
    image: ollama/ollama:0.12.6
    scale: ${OLLAMA_CONTAINERS:-1}
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 24

  # Scarica il modello chat se manca, poi termina. I paper si cercano con il modello di
  # ricerca dentro il servizio Coach: a Ollama non serve un modello di embedding.
  ollama-pull:
    image: ollama/ollama:0.12.6
    scale: ${OLLAMA_CONTAINERS:-1}
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
      CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:7b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - ollama show "$$CHAT_MODEL" > /dev/null 2>&1 || ollama pull "$$CHAT_MODEL"

volumes:
  ollama-models:
  auth-data:
  coach-data:
  web-modules:
