name: biketr

services:
  web:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${WEB_PORT:-5050}:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./docker/nginx:/etc/nginx/templates:ro
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
    depends_on:
      auth:
        condition: service_started
      # Non aspetta i modelli: la pagina si apre anche durante il primo download,
      # e parte anche quando Ollama è spento (OLLAMA_CONTAINERS=0).
      ollama:
        condition: service_started
        required: false

  # Login Strava: l'unico servizio che vede il client secret e il refresh token.
  auth:
    image: node:22-alpine
    # Inoltra a Node il segnale di stop: senza, `docker compose down` attende 10 s.
    init: true
    command: ["node", "/app/server.mjs"]
    volumes:
      - ./docker/auth:/app:ro
      # Token Strava: restano dopo `docker compose down`, spariscono con `down -v`.
      - auth-data:/data
    environment:
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:-}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:-}
      WEB_PORT: ${WEB_PORT:-5050}

  ollama:
    image: ollama/ollama:0.12.6
    scale: ${OLLAMA_CONTAINERS:-1}
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 24

  # Scarica i modelli che mancano, poi termina.
  ollama-pull:
    image: ollama/ollama:0.12.6
    scale: ${OLLAMA_CONTAINERS:-1}
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
      CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:7b}
      EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        status=0
        for model in "$$CHAT_MODEL" "$$EMBED_MODEL"; do
          ollama show "$$model" > /dev/null 2>&1 && continue
          ollama pull "$$model" || status=1
        done
        exit $$status

volumes:
  ollama-models:
  auth-data:
