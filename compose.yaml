name: biketr

# Impostazioni del Coach da .env, uguali per il servizio e per i suoi comandi (coach-tools).
# La chiave del provider cloud resta qui e nel servizio Coach: il browser non la vede mai.
x-coach-env: &coach-env
  OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
  OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-}
  COACH_PROVIDER: ${COACH_PROVIDER:-}
  CLOUD_URL: ${CLOUD_URL:-}
  CLOUD_API_KEY: ${CLOUD_API_KEY:-}
  CLOUD_MODEL: ${CLOUD_MODEL:-}
  CLOUD_PRICE_IN: ${CLOUD_PRICE_IN:-}
  CLOUD_PRICE_OUT: ${CLOUD_PRICE_OUT:-}
  CLOUD_SPENDING_LIMIT: ${CLOUD_SPENDING_LIMIT:-}
  # Dove mandare le tracce: Phoenix, qui sotto. Il Coach risponde anche quando Phoenix è spento.
  PHOENIX_URL: http://phoenix:6006
  # Il database delle attività, qui sotto: lo raggiunge solo il Coach.
  DATABASE_URL: postgresql://biketr:${POSTGRES_PASSWORD:-biketr}@db:5432/biketr

services:
  web:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${WEB_PORT:-5050}:80"
    volumes:
      # Solo per l'indice dei paper, che il Coach service scarica a ogni richiesta.
      - ./:/usr/share/nginx/html:ro
      - ./docker/nginx:/etc/nginx/templates:ro
    depends_on:
      app:
        condition: service_started
      auth:
        condition: service_started
      coach:
        condition: service_started

  # L'app del browser: server di sviluppo Vite con live reload, raggiungibile solo da nginx.
  app:
    image: node:22-alpine
    init: true
    working_dir: /workspace/web
    # Installa i pacchetti npm che mancano, poi esegue il comando.
    entrypoint: ["sh", "scripts/start.sh"]
    command: ["npx", "vite"]
    volumes:
      - ./web:/workspace/web
      # Pacchetti npm installati nel container: quelli del computer non entrano mai.
      - web-modules:/workspace/web/node_modules
      # Codice del server di autenticazione, per il controllo dei tipi e i test.
      - ./docker/auth:/workspace/docker/auth:ro
      # Attività inventate e carichi attesi dei test del Coach: la copia della formula del carico
      # nel browser si confronta con quelli (tests/core/load-reference.test.ts).
      - ./docker/coach/tests/fixtures:/workspace/docker/coach/tests/fixtures:ro

  # Login Strava: l'unico servizio che vede il client secret e il refresh token.
  auth:
    image: node:22-alpine
    # Inoltra a Node il segnale di stop: senza, `docker compose down` attende 10 s.
    init: true
    command: ["node", "/app/server.ts"]
    volumes:
      - ./docker/auth:/app:ro
      # Token Strava: restano dopo `docker compose down`, spariscono con `down -v`.
      - auth-data:/data
    environment:
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:-}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:-}
      WEB_PORT: ${WEB_PORT:-5050}

  # Servizio Coach: parla con il modello chat scelto in .env (Ollama o un provider cloud).
  coach:
    # Python, i pacchetti di docker/coach/requirements.txt e il modello di ricerca dei paper;
    # il codice è montato qui sotto.
    build: ./docker/coach
    image: biketr-coach
    init: true
    volumes:
      - ./docker/coach:/app:ro
      # Il totale speso per il modello cloud, che "Disconnetti da Strava" non tocca, e la
      # cancellazione delle tracce che "Disconnetti da Strava" lascia in attesa finché Phoenix
      # non risponde. Le attività di Strava stanno nel database (servizio db).
      - coach-data:/data
    environment: *coach-env
    depends_on:
      # All'avvio il Coach crea le tabelle: aspetta che il database accetti connessioni.
      db:
        condition: service_healthy
      # Non aspetta i modelli: il Coach parte anche durante il primo download,
      # e anche quando Ollama è spento (OLLAMA_CONTAINERS=0).
      ollama:
        condition: service_started
        required: false

  # Comandi che usano la cartella del progetto: la ricostruzione dell'indice dei paper, il
  # controllo dal vivo (python -m app.live_check, risultati in live-checks/), la corsa del set
  # di valutazione (python -m app.evaluation, risultati in eval-runs/) e il suo voto
  # (python -m app.grading). Parte solo quando lo si nomina:
  # docker compose run --rm coach-tools <comando>.
  coach-tools:
    build: ./docker/coach
    # La stessa immagine del Coach: dopo `docker compose up -d --build` anche questa è nuova.
    image: biketr-coach
    profiles: [tools]
    init: true
    volumes:
      - ./docker/coach:/app:ro
      - ./:/project
      # Lo stesso totale speso del Coach: i comandi rispettano lo stesso tetto.
      - coach-data:/data
    environment: *coach-env
    depends_on:
      db:
        condition: service_healthy

  # Phoenix: le tracce di ogni richiesta del Coach, con passi, prompt, paper, risposta, token e
  # costo. Si apre solo da questo computer, su http://localhost:6006 (PHOENIX_PORT in .env).
  phoenix:
    image: arizephoenix/phoenix:version-20.24.0
    # L'utente senza privilegi dell'immagine, al posto di root.
    user: "65532:65532"
    ports:
      - "127.0.0.1:${PHOENIX_PORT:-6006}:6006"
    environment:
      # Niente richieste a internet: né pixel di statistiche né caratteri scaricati dalla pagina.
      PHOENIX_TELEMETRY_ENABLED: "false"
      PHOENIX_ALLOW_EXTERNAL_RESOURCES: "false"
    volumes:
      # Le tracce, in ~/.phoenix: restano dopo `docker compose down`, spariscono con `down -v`.
      # Il volume va sulla cartella home dell'utente, che è sua: montato su una cartella che
      # l'immagine non ha, apparterrebbe a root e Phoenix non potrebbe scriverci.
      - phoenix-data:/home/nonroot

  # Il database: tutte le attività di Strava con i dettagli corsa, l'atleta e le statistiche.
  # Nessuna porta pubblicata: lo raggiunge solo il Coach, dentro Docker. I dati restano dopo
  # `docker compose down`, spariscono con `down -v`; "Disconnetti da Strava" cancella le attività.
  db:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_USER: biketr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-biketr}
      POSTGRES_DB: biketr
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "biketr", "-d", "biketr"]
      interval: 2s
      timeout: 5s
      retries: 30

  ollama:
    image: ollama/ollama:0.12.6
    scale: ${OLLAMA_CONTAINERS:-1}
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 24

  # Scarica il modello chat se manca, poi termina. I paper si cercano con il modello di
  # ricerca dentro il servizio Coach: a Ollama non serve un modello di embedding.
  ollama-pull:
    image: ollama/ollama:0.12.6
    scale: ${OLLAMA_CONTAINERS:-1}
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
      CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:7b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - ollama show "$$CHAT_MODEL" > /dev/null 2>&1 || ollama pull "$$CHAT_MODEL"

volumes:
  ollama-models:
  auth-data:
  coach-data:
  db-data:
  phoenix-data:
  web-modules:
