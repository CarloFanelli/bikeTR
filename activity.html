<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attività — BikeTR</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <header>
    <h1><a href="index.html" style="color:inherit;text-decoration:none">← BikeTR</a></h1>
    <div id="auth-status"></div>
  </header>
  <main>
    <section id="loading"><p>Carico attività…</p></section>
    <section id="error" hidden><p class="err"></p></section>

    <section id="detail" hidden>
      <h2 id="act-name"></h2>
      <div id="act-meta" class="muted"></div>
      <div class="metrics" id="act-metrics"></div>
      <div id="map"></div>
      <div id="splits-wrap" hidden>
        <h3>Split per km</h3>
        <ul id="splits"></ul>
      </div>

      <div id="segments-wrap" hidden>
        <h3>🏁 Segmenti</h3>
        <ul id="segments"></ul>
      </div>
    </section>
  </main>
  <script type="module" src="activity.js"></script>
</body>
</html>
